<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário com Validação - 18/11</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <form id="formulario" novalidate>
        <div class="titulo">
            <h2>Cadastro</h2>
        </div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome">
        <span id="erroNome" class="erro"></span>
        <label for="email">E-mail:</label>
        <input type="email" id="email">
        <span id="erroEmail" class="erro"></span>
        <label for="idade">Idade:</label>
        <input type="number" id="idade">
        <span id="erroIdade" class="erro"></span>
        <label for="senha">Senha:</label>
        <input type="password" id="senha">
        <span id="erroSenha" class="erro"></span>
        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha">
        <span id="erroConfirmarSenha" class="erro"></span>
        <button type="submit">Enviar</button>
        <p id="mensagemSucesso" class="sucesso"></p>
    </form>
</body>

</html>
