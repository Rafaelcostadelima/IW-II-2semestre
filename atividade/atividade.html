<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquina de passar vontade</title>
</head>

<body>
    <p>Pressione o botão de qual refrigerante gostaria passar vontade de tomar:</p>
    <form>
        <input type="radio" id="coca" name="refrigerante" value="1">
        <label for="coca">Coca-cola</label><br>
        <input type="radio" id="fanta" name="refrigerante" value="2">
        <label for="fanta">Fanta Uva</label><br>
        <input type="radio" id="guarana" name="refrigerante" value="3">
        <label for="guarana">Guaraná</label>
        <input type="radio" id="pepsi" name="refrigerante" value="4">
        <label for="pepsi">Pepsi</label>
    </form>
</body>

</html>
